openapi: 3.0.3
info:
  title: API Reference | ReDoc
  version: 1.0.0
  description: API для керування контактами та аутентифікації користувачів
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: auth
    description: Операції, пов'язані з аутентифікацією користувачів
  - name: contacts
    description: Операції з контактами користувачів
  - name: general
    description: Загальні ендпоінти

servers:
  #- url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-5okd.onrender.com

security:
  - bearerAuth: []

paths:
  /:
    get:
      operationId: getRoot
      tags:
        - general
      summary: Стартова точка API
      responses:
        '200':
          description: API працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Некоректний запит

  /auth/register:
    post:
      operationId: registerUser
      tags:
        - auth
      summary: Реєстрація нового користувача
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: Користувача створено
        '400':
          description: Некоректні дані

  /auth/login:
    post:
      operationId: loginUser
      tags:
        - auth
      summary: Логін користувача
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успішний логін
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Некоректний запит
        '401':
          description: Невірний логін або пароль

  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - auth
      summary: Оновлення сесії
      responses:
        '200':
          description: Оновлення успішне
        '401':
          description: Неавторизований

  /auth/logout:
    post:
      operationId: logoutUser
      tags:
        - auth
      summary: Вихід користувача
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Успішний вихід
        '401':
          description: Неавторизований

  /auth/send-reset-email:
    post:
      operationId: sendResetEmail
      tags:
        - auth
      summary: Відправка листа для скидання пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Лист відправлено
        '400':
          description: Некоректний запит

  /auth/reset-pwd:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Скидання пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Пароль змінено
        '400':
          description: Некоректний запит

  /contacts:
    get:
      operationId: getAllContacts
      tags:
        - contacts
      summary: Отримати всі контакти
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список контактів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          description: Неавторизований
    post:
      operationId: createContact
      tags:
        - contacts
      summary: Створити контакт
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - phone
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Контакт створено
        '400':
          description: Некоректні дані
        '401':
          description: Неавторизований

  /contacts/{contactId}:
    get:
      operationId: getContactById
      tags:
        - contacts
      summary: Отримати контакт за ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Деталі контакту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Неавторизований
        '404':
          description: Контакт не знайдено
    patch:
      operationId: updateContact
      tags:
        - contacts
      summary: Оновити контакт
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Контакт оновлено
        '400':
          description: Некоректні дані
        '401':
          description: Неавторизований
        '404':
          description: Контакт не знайдено
    delete:
      operationId: deleteContact
      tags:
        - contacts
      summary: Видалити контакт
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Контакт видалено
        '401':
          description: Неавторизований
        '404':
          description: Контакт не знайдено

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        photoURL:
          type: string
          nullable: true
