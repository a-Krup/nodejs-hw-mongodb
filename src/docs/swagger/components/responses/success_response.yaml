description: Успішна відповідь
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Успішно виконано
        data:
          description: Основна інформація, яку повертає сервер. Це може бути новостворений обʼєкт, список елементів, підтвердження дії або інші дані — залежно від запиту.
          anyOf:
            - type: object
            - type: array
            - type: string
            - type: boolean
            - type: number