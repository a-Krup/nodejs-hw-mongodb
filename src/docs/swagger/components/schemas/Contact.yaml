type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    type: string
    example: "64a9e1a8f4b8d9b1c1234568"
  name:
    type: string
    example: "Jane Smith"
  phoneNumber:
    type: string
    example: "+380671234567"
  email:
    type: string
    format: email
    example: "jane.smith@example.com"
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    example: personal
  photo:
    type: string
    format: uri
    example: "https://res.cloudinary.com/yourimage.jpg"
  userId:
    type: string
    example: "64a9e1a8f4b8d9b1c1234567"
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time