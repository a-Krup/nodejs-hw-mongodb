post:
  operationId: loginUser
  summary: Логін користувача
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: "john.doe@example.com"
            password:
              type: string
              example: "password123"
  responses:
    '200':
      description: Користувач успішно залогінився
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: "Successfully logged in a user!"
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    '400':
      $ref: ../../components/responses/error_response.yaml