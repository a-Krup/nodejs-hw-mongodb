post:
  operationId: refreshSession
  tags:
    - auth
  summary: Оновлення сесії (отримання нового access token)
  security:
    - bearerAuth: []
  responses:
    200:
      description: Успішне оновлення сесії
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: "Successfully refreshed a session!"
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    401:
      $ref: ../../components/responses/error_response.yaml