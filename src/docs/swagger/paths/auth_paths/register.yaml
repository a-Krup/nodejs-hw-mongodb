post:
  operationId: registerUser
  tags:
    - auth
  summary: Реєстрація користувача
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              format: email
              example: "john.doe@example.com"
            password:
              type: string
              example: "password123"
  responses:
    201:
      description: Користувача успішно зареєстровано
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: "Successfully registered a user!"
              data:
                $ref: ../../components/schemas/User.yaml
    400:
      $ref: ../../components/responses/error_response.yaml