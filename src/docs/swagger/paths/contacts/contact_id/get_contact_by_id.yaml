operationId: getContactById
summary: Отримати контакт за ID
tags:
  - contacts
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Контакт знайдено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contact with id {contactId}!"
            data:
              $ref: ../../../components/schemas/Contact.yaml
  '404':
    $ref: ../../../components/responses/error_response.yaml
  '401':
    $ref: ../../../components/responses/error_response.yaml