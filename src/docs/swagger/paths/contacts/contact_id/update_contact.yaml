operationId: updateContactById
summary: Оновити контакт за ID
tags:
  - contacts
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully patched a contact!"
            data:
              $ref: ../../../components/schemas/Contact.yaml
  '400':
    $ref: ../../../components/responses/error_response.yaml
  '401':
    $ref: ../../../components/responses/error_response.yaml
  '404':
    $ref: ../../../components/responses/error_response.yaml