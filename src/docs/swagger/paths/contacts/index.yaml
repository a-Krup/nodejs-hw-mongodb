get:
  summary: Get all contacts with pagination and filtering
  tags:
    - contacts
  operationId: getContacts
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        default: 1
    - name: perPage
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 10
  responses:
    '200':
      description: Successfully found contacts
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/Contact.yaml
                  page:
                    type: integer
                    example: 2
                  perPage:
                    type: integer
                    example: 4
                  totalItems:
                    type: integer
                    example: 6
                  totalPages:
                    type: integer
                    example: 2
                  hasPreviousPage:
                    type: boolean
                    example: true
                  hasNextPage:
                    type: boolean
                    example: false
    '401':
      $ref: ../../components/responses/error_response.yaml
    '500':
      $ref: ../../components/responses/error_response.yaml